# Config do Spark do job de streaming (bronze).
# Lido automaticamente via SPARK_CONF_DIR=/opt/spark-conf.

spark.master                                     local[2]
spark.driver.memory                              1500m
spark.driver.host                                127.0.0.1
spark.local.dir                                  /tmp/spark

# Delta Lake
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog

# Mantem o protocolo Delta na versao classica (reader 1 / writer 2), para que a
# leitura via delta-rs (dashboard) funcione sem surpresa.
spark.databricks.delta.properties.defaults.enableDeletionVectors  false

# Timestamps exibidos/derivados no fuso do pregao.
spark.sql.session.timeZone                       America/Sao_Paulo

# Volume de dados aqui e pequeno: nao faz sentido 200 particoes de shuffle.
spark.sql.shuffle.partitions                     4

# Arquivos criados com permissao aberta: Spark (uid 50000) e Airflow (uid 50000)
# compartilham o mesmo volume, e o dashboard le como outro usuario.
spark.hadoop.fs.permissions.umask-mode           000

# UI do streaming em http://localhost:4040
spark.ui.enabled                                 true
spark.ui.port                                    4040
