# Config da SparkSession que o dbt instancia (method=session).
# Lido via SPARK_CONF_DIR=/opt/spark-conf.

spark.master                                     local[2]
spark.driver.memory                              2g
spark.driver.host                                127.0.0.1
spark.local.dir                                  /tmp/spark

# Delta Lake
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.properties.defaults.enableDeletionVectors  false

# Catalogo Hive com metastore Derby embutido, no volume compartilhado.
# Quem escreve no metastore e SEMPRE o dbt, um processo por vez - por isso o
# Airflow roda com SequentialExecutor. O job de streaming grava por caminho e
# nao usa metastore, justamente para nao disputar o lock do Derby.
spark.sql.catalogImplementation                  hive
spark.sql.warehouse.dir                          file:/data/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL      jdbc:derby:;databaseName=/data/metastore_db;create=true
spark.driver.extraJavaOptions                    -Dderby.system.home=/data/derby

spark.sql.session.timeZone                       America/Sao_Paulo
spark.sql.shuffle.partitions                     4
spark.hadoop.fs.permissions.umask-mode           000

# Sem UI: quem precisa ver o streaming olha a do container spark-streaming (4040).
spark.ui.enabled                                 false
